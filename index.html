/* ======================= utilidades ======================= */
const $ = s => document.querySelector(s);

const R = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd1 = x => Math.round(x * 10) / 10;
const rnd2 = x => Math.round(x * 100) / 100;
const num = x => x.toLocaleString('pt-BR', { maximumFractionDigits: 4 });
const money = n => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
const pct = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';

/* monta as 4 alternativas (a primeira é a correta; as outras são erros comuns, sem repetição) */
function opts(c, wrongs, fmt) {
  const ct = fmt(c), seen = new Set([ct]), out = [];
  for (const w of wrongs) {
    if (!isFinite(w) || w < 0) continue;
    const t = fmt(w);
    if (!seen.has(t)) { seen.add(t); out.push(t); }
    if (out.length === 3) break;
  }
  const step = Math.max(1, Math.round(Math.abs(c) * 0.1));
  let k = 1;
  while (out.length < 3) {
    const t = fmt(c + step * k);
    if (!seen.has(t)) { seen.add(t); out.push(t); }
    k++;
  }
  return { options: [ct, ...out], correct: ct };
}

/* ======================= som e confete ======================= */
let muted = false, ac;
function beep(freqs, dur = 0.12) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.05, t + i * dur);
      g.gain.exponentialRampToValueAtTime(0.001, t + (i + 1) * dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i * dur); o.stop(t + (i + 1) * dur);
    });
  } catch (e) { /* sem áudio: tudo bem */ }
}
const SFX = { ok: [660, 880], bad: [220, 160], promo: [523, 659, 784, 1047], win: [523, 659, 784, 1047, 1319], lose: [300, 250, 200, 150] };

$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; };

function confetti() {
  const box = $('#confetti'), cols = ['#217346', '#f2b705', '#e74c3c', '#3498db', '#9b59b6'];

    const s = document.createElement('span');
    s.className = 'cf';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = cols[i % cols.length];
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = Math.random() * 0.6 + 's';
    box.appendChild(s);

  setTimeout(() => { box.innerHTML = ''; }, 5000);
}

/* ======================= banco de perguntas: porcentagem de vendas (números aleatórios) ======================= */
function pShare() {
  const T = R([200, 400, 500, 1000]), p = R([10, 20, 25, 40, 50]), V = T * p / 100, item = R(['Notebook', 'Impressora', 'Cadeira', 'Monitor', 'Mouse']);
  const o = opts(p, [p + 10, 100 - p, Math.round(T / V * 100), p * 2], pct);
  return { tier: 1, grid: { rows: [['Item', 'Vendas'], [item, money(V)], ['Total da loja', money(T)]] },
    q: `O produto <b>${item}</b> vendeu ${money(V)} de um total de ${money(T)}. Qual a participação dele no total de vendas?`, ...o,
    exp: `Participação = parte ÷ total × 100 → ${money(V)} ÷ ${money(T)} × 100 = ${pct(p)}.` };
}
function pPercentOf() {
  const p = R([10, 20, 25, 50]), V = R([200, 400, 800, 1200]), a = V * p / 100;
  const o = opts(a, [V * p, V / p, V - a, V + a], money);
  return { tier: 1, q: `Quanto é <b>${p}%</b> de <b>${money(V)}</b>?`, ...o,
    exp: `${p}% de ${money(V)} = ${money(V)} × ${p} ÷ 100 = ${money(a)}.` };
}
function pGoal() {
  const M = R([1000, 2000, 5000, 8000]), c = R([50, 60, 80, 90, 120]), V = M * c / 100;
  const o = opts(c, [c + 10, c - 10, Math.round(M / V * 100), 100 - c], pct);
  return { tier: 1, grid: { rows: [['Meta', 'Vendido', '% atingido'], [money(M), money(V), '?']] },
    q: `A meta de vendas do mês era ${money(M)} e foram vendidos ${money(V)}. Que porcentagem da meta foi atingida?`, ...o,
    exp: `% da meta = vendido ÷ meta × 100 = ${money(V)} ÷ ${money(M)} × 100 = ${pct(c)}.` };
}
function pDiscount() {
  const P = R([100, 200, 400, 500]), d = R([10, 20, 25, 50]), desc = P * d / 100, F = P - desc;
  const o = opts(F, [desc, P + desc, P - d, P * d], money);
  return { tier: 1, q: `Uma mochila custa <b>${money(P)}</b> e está com <b>${d}% de desconto</b>. Qual o preço final?`, ...o,
    exp: `Desconto = ${money(P)} × ${d} ÷ 100 = ${money(desc)}. Preço final = ${money(P)} − ${money(desc)} = ${money(F)}.` };
}
function pGrowth() {
  const A = R([200, 400, 500, 800]), g = R([10, 20, 25, 50]), B = A * (1 + g / 100);
  const o = opts(g, [rnd1((B - A) / B * 100), 100 + g, g + 10, g / 2], pct);
  return { tier: 2, grid: { rows: [['Mês', 'Vendas'], ['Janeiro', money(A)], ['Fevereiro', money(B)]] },
    q: `As vendas foram de ${money(A)} em janeiro e ${money(B)} em fevereiro. Qual foi o crescimento percentual?`, ...o,
    exp: `Crescimento = (novo − antigo) ÷ antigo × 100 = (${money(B)} − ${money(A)}) ÷ ${money(A)} × 100 = ${pct(g)}.` };
}
function pCommission() {
  const S = R([1500, 2000]), V = R([10000, 20000, 50000]), c = R([2, 3, 5]), com = V * c / 100, T = S + com;
  const o = opts(T, [com, S + c, S + V * c / 10, S + V * c / 1000], money);
  return { tier: 2, q: `Um vendedor recebe <b>salário fixo de ${money(S)}</b> mais <b>${c}% de comissão</b> sobre as vendas. Neste mês vendeu ${money(V)}. Quanto recebe no total?`, ...o,
    exp: `Comissão = ${money(V)} × ${c} ÷ 100 = ${money(com)}. Total = ${money(S)} + ${money(com)} = ${money(T)}.` };
}
function pDrop() {
  const A = R([500, 800, 1000, 2000]), d = R([10, 20, 25, 40]), B = A * (1 - d / 100);
  const o = opts(d, [rnd1((A - B) / B * 100), 100 - d, d + 5, d * 2], pct);
  return { tier: 2, grid: { rows: [['Mês', 'Vendas'], ['Janeiro', money(A)], ['Fevereiro', money(B)]] },
    q: `As vendas caíram de ${money(A)} em janeiro para ${money(B)} em fevereiro. Qual foi a queda percentual?`, ...o,
    exp: `Queda = (antigo − novo) ÷ antigo × 100 = (${money(A)} − ${money(B)}) ÷ ${money(A)} × 100 = ${pct(d)}.` };
}
function pSeller() {
  const vals = R([[200, 300, 500], [100, 150, 250], [40, 60, 100], [250, 250, 500]]);
  const names = shuffle(['Ana', 'Bruno', 'Carla']), i = Math.floor(Math.random() * 3);
  const total = vals.reduce((a, b) => a + b, 0), shares = vals.map(v => v / total * 100), c = shares[i];
  const wr = shares.filter((_, j) => j !== i).concat([c + 10, c - 10]);
  const o = opts(c, wr, pct);
  return { tier: 2, grid: { rows: [['Vendedor', 'Vendas'], ...names.map((n, j) => [n, money(vals[j])]), ['Total', money(total)]] },
    q: `Qual a participação de <b>${names[i]}</b> nas vendas totais da equipe?`, ...o,
    exp: `${names[i]}: ${money(vals[i])} ÷ ${money(total)} × 100 = ${pct(c)}.` };
}
function pUpDown() {
  const P = R([100, 200, 400, 800]), a = R([10, 20, 25]);
  const mid = rnd2(P * (1 + a / 100)), F = rnd2(P * (1 + a / 100) * (1 - a / 100));
  const o = opts(F, [P, rnd2(P * (1 + a * a / 10000)), rnd2(P * (1 - a / 100)), rnd2(P * (1 + a / 100))], money);
  return { tier: 3, q: `Um produto de <b>${money(P)}</b> sofreu aumento de <b>${a}%</b> e, na semana seguinte, desconto de <b>${a}%</b> sobre o novo preço. Qual o preço final?`, ...o,
    exp: `Após o aumento: ${money(P)} × ${num(1 + a / 100)} = ${money(mid)}. O desconto incide sobre esse valor: ${money(mid)} × ${num(1 - a / 100)} = ${money(F)}. Aumento e desconto iguais não se anulam.` };
}
function pOverGoal() {
  const M = R([5000, 8000, 10000]), c = R([110, 120, 125, 150]), V = M * c / 100;
  const o = opts(V, [V - M, M + c, M * c, rnd2(M / (c / 100))], money);
  return { tier: 3, q: `A meta de Ana era <b>${money(M)}</b> e ela atingiu <b>${c}%</b> dela. Quanto ela vendeu?`, ...o,
    exp: `Vendido = ${money(M)} × ${c} ÷ 100 = ${money(V)}. Passar de 100% significa vender mais que a meta.` };
}
function pMargin() {
  const P = R([100, 200, 500]), m = R([20, 25, 40, 50]), C = P * (1 - m / 100), L = P - C;
  const o = opts(m, [rnd1(L / C * 100), 100 - m, m / 2, m + 10], pct);
  return { tier: 3, grid: { rows: [['Custo', 'Venda', 'Lucro'], [money(C), money(P), money(L)]] },
    q: `Uma mercadoria custou ${money(C)} e é vendida por ${money(P)}. Qual a <b>margem de lucro sobre o preço de venda</b>?`, ...o,
    exp: `Lucro = ${money(P)} − ${money(C)} = ${money(L)}. Margem = lucro ÷ preço de venda × 100 = ${money(L)} ÷ ${money(P)} × 100 = ${pct(m)}.` };
}
function pPctOfPct() {
  const a = R([40, 50, 60, 80]), b = R([25, 50, 20]), c = a * b / 100;
  const o = opts(c, [a + b, Math.abs(a - b), b, a], pct);
  return { tier: 3, q: `Em uma campanha, <b>${a}%</b> dos clientes compraram, e <b>${b}%</b> dessas compras foram parceladas. Que porcentagem do total de clientes fez compra parcelada?`, ...o,
    exp: `${b}% de ${a}% = ${a} × ${b} ÷ 100 = ${pct(c)} dos clientes.` };
}
const PROC = { 1: [pShare, pPercentOf, pGoal, pDiscount], 2: [pGrowth, pCommission, pDrop, pSeller], 3: [pUpDown, pOverGoal, pMargin, pPctOfPct] };

let used = new Set(), lastTpl = null;
function pickQuestion(tier) {
  const pool = STATIC.filter(s => s.tier === tier && !used.has(s.id));
  if (pool.length && Math.random() < 0.55) {
    const s = R(pool); used.add(s.id);
    return { tier, grid: s.grid, q: s.q, options: s.o.slice(), correct: s.o[0], exp: s.exp };
  }
  let fn;
  do { fn = R(PROC[tier]); } while (fn === lastTpl && PROC[tier].length > 1);
  lastTpl = fn;
  return fn();
}

/* ======================= desenho da planilha ======================= */
function gridHTML(g, safe) {
  const rows = g.rows, cols = Math.max(...rows.map(r => r.length));
  const L = i => String.fromCharCode(65 + i);
  let h = `<div class="sheetwrap"><div class="sheetbar">📗 Relatorio_${EMPRESA.replace(/\s/g, '')}.xlsx</div><table class="sheet"><tr><th class="rn"></th>`;
  for (let c = 0; c < cols; c++) h += `<th>${L(c)}</th>`;
  h += '</tr>';
  rows.forEach((r, ri) => {
    h += `<tr><th class="rn">${ri + 1}</th>`;
    for (let c = 0; c < cols; c++) {
      let v = r[c] == null ? '' : String(r[c]); const cls = [];
      if (ri === 0) cls.push('hd');
      if (v.startsWith("'")) { cls.push('txt'); v = v.slice(1); }
      else if (v.startsWith('#')) cls.push('err');
      else if (v.startsWith('=')) cls.push('fx');
      else if (ri > 0 && /^(R\$\s?)?-?[\d.,]+%?$/.test(v)) cls.push('num');
      h += `<td class="${cls.join(' ')}">${safe ? esc(v) : v}</td>`;
    }
    h += '</tr>';
  });
  return h + '</table></div>';
}

function answer(i) {
  if (S.answered) return;
  S.answered = true;
  const q = S.q, ok = q.shuf[i] === q.correct;
  view.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (q.shuf[j] === q.correct) b.classList.add('ok'); else if (j === i) b.classList.add('bad');
  });
  let msg, label = 'Próxima pergunta ➜', after;
  if (S.phase === 1) {
    if (ok) {
      S.score += 100; S.xp += 100; S.correct++; sfx('ok');
      msg = '✅ <b>Correto!</b> +100 pontos e +100 XP.';
      if (S.xp >= NEED[S.cargo]) { label = '🎉 Ver promoção'; after = promote; } else after = nextQ;
    } else {
      S.lives--; S.wrong++; sfx('bad'); $('#qcard').classList.add('shake');
      msg = '❌ <b>Não foi dessa vez.</b> Você perdeu 1 vida.';
      if (S.lives <= 0) { label = 'Continuar'; after = showFired; } else after = nextQ;
    }
  } else {
    const b = S.boss;
    if (ok) {
      b.hits++; b.hp = Math.max(0, 100 - b.hits * 20); S.score += 100; S.correct++; sfx('ok');
      msg = `✅ <b>Acertou!</b> O ${BOSS} sofreu 20% de dano.`;
      if (b.hits >= 5) { label = '🏆 Ver resultado'; after = showWin; } else after = nextBossQ;
    } else {
      b.errors++; S.wrong++; sfx('bad'); $('#qcard').classList.add('shake');
      msg = `❌ <b>Errou!</b> ${b.errors > 2 ? 'Esse foi o terceiro erro.' : `Você já cometeu ${b.errors} de 2 erros permitidos. O próximo erro é fatal.`}`;
      if (b.errors > 2) { label = 'Continuar'; after = showLose; } else after = nextBossQ;
    }
  }
  updateHud();
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${msg}
    ${ok ? '' : `<p>Resposta certa: <b>${q.correct}</b></p>`}<p>💡 ${q.exp}</p>
    <button class="btn" id="nx">${label}</button></div>`;
  const nx = $('#nx'); nx.onclick = after; nx.focus({ preventScroll: true });
  nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ======================= modo Kahoot (turma) =======================
   Toda a partida viaja pela "presença" da sala em tempo real:
   - o professor publica o estado do jogo (PIN, pergunta, resultado);
   - cada aluno publica apelido, resposta, tempo e pontos;
   - todos calculam o placar a partir da presença de todos. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => (+n || 0).toLocaleString('pt-BR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeB = s => esc(s).replace(/&lt;(\/?)b&gt;/g, '<$1b>');   // só <b> é permitido
const KSHP = ['▲', '◆', '●', '■'];
const KS_HOST = 'pp_kh_host', KS_PLAYER = 'pp_kh_player';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento: tudo bem */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* idem */ } }
};
const KH = { room: null, user: null, ready: false, canHost: false, peers: [], conn: true, role: null, tick: null, tm: null };
let H = null, P = null;
const clampLim = v => Math.min(60, Math.max(5, +v || 20));

function khStop() { clearInterval(KH.tick); clearTimeout(KH.tm); KH.tick = null; KH.tm = null; }
function khClear() {
  if (!KH.room) return;
  KH.room.presence({ role: null, gid: null, st: null, i: null, n: null, lim: null, q: null, rv: null, nm: null, sc: null, sk: null, dl: null, ai: null, ac: null, ams: null, si: null, ok: null }).catch(() => {});
}
function khExit() { khStop(); khClear(); KH.role = null; H = null; P = null; showStart(); }


/* ---------- sala em tempo real fora do claude.ai (MQTT público via WebSocket) ----------
   Imita a API "room" (presence / onPeers / onConnection / connected). Cada aparelho publica
   sua presença num tópico próprio; o "will" apaga a presença se a aba fechar. */
function mqttRoom() {
  return new Promise(resolve => {
    if (!window.mqtt) return resolve(null);
    const NS = 'pp-premiada-k7x3/p/';
    const URLS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
    const me = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    let ui = 0, client = null, up = false, done = false, local = {}, hb = null;
    const remote = new Map(), peersCb = [], connCb = [];
    const emit = () => {
      const now = Date.now(), peers = [];
      remote.forEach((v, id) => { if (now - v.ts > 25000) remote.delete(id); else peers.push({ peer: id, presence: v.pr, sameTab: false }); });
      peers.push({ peer: me, presence: Object.assign({}, local), sameTab: true });
      peersCb.forEach(f => { try { f({ peers }); } catch (e) {} });
    };
    const pub = () => { if (client && up) try { client.publish(NS + me, JSON.stringify({ ts: Date.now(), pr: local }), { retain: true, qos: 0 }); } catch (e) {} };
    const room = {
      presence(patch) { Object.keys(patch || {}).forEach(k => { if (patch[k] == null) delete local[k]; else local[k] = patch[k]; }); pub(); emit(); return Promise.resolve(); },
      connected() { return up; },
      onPeers(cb) { peersCb.push(cb); setTimeout(emit, 0); },
      onConnection(cb) { connCb.push(cb); }
    };
    const open = () => {
      try { if (client) client.end(true); } catch (e) {}
      client = window.mqtt.connect(URLS[ui], { clientId: 'pp_' + me, reconnectPeriod: 2500, connectTimeout: 6000, clean: true,
        will: { topic: NS + me, payload: '', retain: true, qos: 0 } });
      client.on('connect', () => {
        up = true; client.subscribe(NS + '#');
        pub(); connCb.forEach(f => { try { f(true); } catch (e) {} });
        if (!hb) hb = setInterval(() => { pub(); emit(); }, 5000);
        if (!done) { done = true; resolve(room); }
      });
      const down = () => { if (up) { up = false; connCb.forEach(f => { try { f(false); } catch (e) {} }); } };
      client.on('close', down); client.on('offline', down);
      client.on('message', (t, buf) => {
        const id = t.slice(NS.length); if (id === me) return;
        const txt = buf.toString();
        if (!txt) { remote.delete(id); emit(); return; }
        try { const o = JSON.parse(txt); if (o && o.pr && Date.now() - o.ts < 25000) { remote.set(id, { ts: o.ts, pr: o.pr }); emit(); } } catch (e) {}
      });
    };
    open();
    setTimeout(() => { if (!done && ui + 1 < URLS.length) { ui++; open(); } }, 6500);
    setTimeout(() => { if (!done) { done = true; try { client.end(true); } catch (e) {} resolve(null); } }, 14000);
    window.addEventListener('pagehide', () => { try { client.publish(NS + me, '', { retain: true }); client.end(true); } catch (e) {} });
  });
}

async function khConnect() {
  if (KH.ready) return !!KH.room;
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  KH.room = await use('room');
  KH.user = await use('user');
  if (!KH.room) { KH.room = await mqttRoom(); KH.user = null; }
  try { KH.canHost = KH.user ? await KH.user.canEdit() : true; } catch (e) { KH.canHost = true; }
  if (KH.room) {
    try { KH.conn = KH.room.connected(); } catch (e) { KH.conn = true; }
    KH.room.onPeers(ch => { KH.peers = ch.peers; khPeers(); }, () => { KH.conn = false; khPeers(); });
    KH.room.onConnection(c => { KH.conn = c; khPeers(); }, () => {});
  }
  KH.ready = true;
  return !!KH.room;
}
function khPeers() {
  if (KH.role === 'host') hostUpdate();
  else if (KH.role === 'player') pSync();
}

/* quem está na sala com este PIN (jogadores) */
function khPlayers(gid) {
  return KH.peers.filter(p => p.presence && p.presence.role === 'p' && p.presence.gid === gid).map(p => {
    const x = p.presence;
    return { id: p.peer, me: !!p.sameTab, nm: String(x.nm == null ? '?' : x.nm).slice(0, 16), sc: +x.sc || 0, dl: +x.dl || 0, sk: +x.sk || 0,
      ai: Number.isInteger(x.ai) ? x.ai : -1, ac: Number.isInteger(x.ac) ? x.ac : -1 };
  });
}
const khBoard = gid => khPlayers(gid).sort((a, b) => b.sc - a.sc || a.nm.localeCompare(b.nm, 'pt-BR'));
const warnBar = () => `<div class="warn" id="connw" ${KH.conn ? 'hidden' : ''}>Sem conexão com a sala. Tentando reconectar…</div>`;

function boardHTML(list, max, showDelta) {
  if (!list.length) return '<p class="mut">Ninguém na sala.</p>';
  return '<div class="bd">' + list.slice(0, max).map((p, k) =>
    `<div class="r${p.me ? ' me' : ''}"><span class="p">${k + 1}º</span><span class="n">${esc(p.nm)}</span>${showDelta && p.dl > 0 ? `<span class="d">+${fmt(p.dl)}</span>` : ''}<b>${fmt(p.sc)}</b></div>`).join('') + '</div>'
    + (list.length > max ? `<p class="mut">e mais ${list.length - max} jogadores</p>` : '');
}
function podiumHTML(list) {
  if (!list.length) return '';
  const g = [list[1], list[0], list[2]], hs = [100, 140, 72], cl = ['#aab4af', '#f2b705', '#c98a52'], lb = ['2º', '1º', '3º'];
  return '<div class="pod">' + g.map((p, k) => p
    ? `<div class="col"><div class="pn">${esc(p.nm)}</div><div class="ps">${fmt(p.sc)} pts</div><div class="blk" style="height:${hs[k]}px;background:${cl[k]}">${lb[k]}</div></div>`
    : '<div class="col"></div>').join('') + '</div>';
}

/* ======================= menu e entrada ======================= */

function khJoinScreen() {

    <div class="big">🎯</div><h2>Entrar na partida</h2>
    <form id="jf" class="jform" autocomplete="off">

async function khJoin(pin, nm) {
  const btn = $('#jgo'), msg = m => { const e = $('#jerr'); if (e) e.textContent = m; };
  const fail = m => { msg(m); if (btn) btn.disabled = false; };
  if (!/^\d{6}$/.test(pin)) return fail('O PIN tem 6 números.');
  if (!nm) return fail('Digite um apelido.');
  if (btn) btn.disabled = true;
  msg('Procurando a sala…');
  const hostOf = () => KH.peers.find(p => p.presence && p.presence.role === 'h' && p.presence.gid === pin);
  for (let k = 0; k < 16 && !hostOf(); k++) await sleep(250);
  if (!hostOf()) return fail('Não achei essa sala. Confira o PIN e veja se o professor já criou a partida.');
  if (khPlayers(pin).some(p => !p.me && p.nm.toLowerCase() === nm.toLowerCase())) return fail('Já tem alguém com esse apelido. Escolha outro.');
  P = pLoad(pin, nm);
  KH.role = 'player';
  pSave(); pPub();
  pSync();
}

/* ======================= professor ======================= */
function khHostSetup() {
  KH.role = null;
  view.innerHTML = `<div class="wrap"><div class="card hero">
    <div class="big">🎤</div><h2>Criar sala</h2>
    <p class="mut">Você apresenta no telão e a turma responde pelos aparelhos.</p>
    <div class="jform">
      <label for="qn">Número de perguntas</label>
      <select id="qn"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option></select>
      <label for="ql">Tempo por pergunta</label>
      <select id="ql"><option value="15">15 segundos</option><option value="20" selected>20 segundos</option><option value="30">30 segundos</option></select>
    </div>
    <button class="btn" id="mk">Criar sala</button><button class="btn alt" id="bk">← Voltar</button>
  </div></div>`;
  $('#mk').onclick = () => khCreate(+$('#qn').value, +$('#ql').value);
  $('#bk').onclick = khMenu;
}

function khCreate(n, lim) {
  used = new Set(); lastTpl = null;
  const t1 = Math.round(n * 0.3), t2 = Math.round(n * 0.4), deck = [];
  for (let k = 0; k < n; k++) {
    const q = pickQuestion(k < t1 ? 1 : k < t1 + t2 ? 2 : 3), sh = shuffle(q.options);
    deck.push({ t: q.q, g: q.grid ? q.grid.rows : null, o: sh, c: sh.indexOf(q.correct), x: q.exp });
  }
  H = { gid: String(100000 + Math.floor(Math.random() * 900000)), deck, n, lim, i: -1, st: 'lobby', qStart: 0, revealing: false };
  KH.role = 'host';
  hostSave();
  hostPub({ role: 'h', gid: H.gid, st: 'lobby', i: -1, n, lim, q: null, rv: null });
  hostRender();
}
function khResume() {
  const s = store.get(KS_HOST);
  if (!s || !Array.isArray(s.deck)) return khHostSetup();
  H = Object.assign({}, s, { qStart: Date.now(), revealing: false });
  KH.role = 'host';
  const d = H.deck[H.i];
  hostPub({ role: 'h', gid: H.gid, st: H.st, i: H.i, n: H.n, lim: H.lim,
    q: d && (H.st === 'q' || H.st === 'rv') ? { t: d.t, g: d.g, o: d.o } : null,
    rv: d && H.st === 'rv' ? { c: d.c, x: d.x } : null });
  hostRender();
}
function hostPub(patch) { if (KH.room) KH.room.presence(patch).catch(() => {}); }
function hostSave() { if (H) store.set(KS_HOST, { gid: H.gid, deck: H.deck, n: H.n, lim: H.lim, i: H.i, st: H.st }); }

function hostQuestion(idx) {
  H.i = idx; H.st = 'q'; H.qStart = Date.now(); H.revealing = false;
  const d = H.deck[idx];
  hostPub({ st: 'q', i: idx, q: { t: d.t, g: d.g, o: d.o }, rv: null });
  hostSave(); hostRender();
}
function hostReveal() {
  if (!H || H.st !== 'q') return;
  khStop(); H.revealing = true; H.st = 'rv';
  const d = H.deck[H.i];
  hostPub({ st: 'rv', rv: { c: d.c, x: d.x } });
  hostSave(); sfx('ok'); hostRender();
}
function hostNext() { if (H.i + 1 < H.n) hostQuestion(H.i + 1); else hostEnd(); }
function hostEnd() {
  khStop(); H.st = 'end';
  hostPub({ st: 'end', q: null, rv: null });
  store.del(KS_HOST); sfx('win'); confetti(); hostRender();
}
function hostCancel() { store.del(KS_HOST); khExit(); }

function hostTick() {
  if (!H || H.st !== 'q') return;
  const el = Date.now() - H.qStart, left = Math.max(0, H.lim - el / 1000);
  const tm = $('#tm'), b = $('#tbar');
  if (tm) tm.textContent = left > 0 ? Math.ceil(left) : '⏰';
  if (b) b.style.width = (left / H.lim * 100) + '%';
  if (el >= H.lim * 1000 + 1500) hostReveal();   // 1,5 s de folga para as respostas chegarem
}

function khQRDraw() {
  const box = $('#qrbox'); if (!box) return;
  const link = KH.link || location.href.split('#')[0].split('?')[0];
  if (typeof qrcode !== 'function') { box.innerHTML = ''; return; }
  try {
    const q = qrcode(0, 'M'); q.addData(link); q.make();
    box.innerHTML = '<div class="qrimg" role="img" aria-label="QR code para abrir o jogo">' + q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }) + '</div>'
      + '<p class="credits">Aponte a câmera do celular para abrir o jogo<br><span id="qrlink"></span></p>'
      + '<button class="btn alt" id="qrchg">🔗 Trocar link do QR</button>';
    $('#qrlink').textContent = link;
    $('#qrchg').onclick = () => {
      const v = prompt('Link que o QR code deve abrir:', link);
      if (v && /^https?:\/\//i.test(v.trim())) { KH.link = v.trim(); khQRDraw(); }
    };
  } catch (e) { box.innerHTML = ''; }
}

function hostRender() {
  khStop();
  const d = H.deck[H.i];
  if (H.st === 'lobby') {
    view.innerHTML = `<div class="wrap wide">${warnBar()}<div class="card hero">
      <p>Alunos: abram este mesmo link, toquem em <b>Modo Kahoot</b> e digitem o PIN</p>
      <div class="pinbox" id="pin" aria-label="PIN do jogo">${H.gid}</div>
      <div id="qrbox"></div>
      <p><b id="pc">0</b> jogadores na sala</p>
      <div class="chips" id="plist"></div>
      <button class="btn" id="st" disabled>▶ Iniciar partida</button>
      <button class="btn alt" id="ex">Sair</button>
      <p class="credits">${H.n} perguntas · ${H.lim} segundos cada</p></div></div>`;
    $('#st').onclick = () => hostQuestion(0);
    $('#ex').onclick = hostCancel;
    khQRDraw();
  } else if (H.st === 'q') {
    view.innerHTML = `<div class="wrap wide">${warnBar()}
      <div class="card hud"><div class="stats"><span class="pill">Pergunta ${H.i + 1} de ${H.n}</span><span class="pill" id="cnt">0/0 responderam</span><span class="pill tmr" id="tm">${H.lim}</span></div>
      <div class="bar"><i id="tbar" style="width:100%;transition:none"></i></div></div>
      <div class="card">${d.g ? gridHTML({ rows: d.g }, true) : ''}<p class="qtext">${safeB(d.t)}</p>
      <div class="tiles">${d.o.map((o, k) => `<div class="tile t${k}"><span class="shp">${KSHP[k]}</span><span class="tx">${safeB(o)}</span></div>`).join('')}</div></div>
      <p style="text-align:center"><button class="btn alt" id="skip">⏭ Encerrar o tempo</button></p></div>`;
    $('#skip').onclick = hostReveal;
    KH.tick = setInterval(hostTick, 200);
  } else if (H.st === 'rv') {
    view.innerHTML = `<div class="wrap wide">${warnBar()}
      <div class="card hud"><div class="stats"><span class="pill">Pergunta ${H.i + 1} de ${H.n}</span><span class="pill">Resultado</span></div></div>
      <div class="card">${d.g ? gridHTML({ rows: d.g }, true) : ''}<p class="qtext">${safeB(d.t)}</p><div id="rvdyn"></div></div>
      <p style="text-align:center"><button class="btn" id="nx">${H.i + 1 < H.n ? 'Próxima pergunta ➜' : '🏁 Ver resultado final'}</button>
      <button class="btn alt" id="fin">Encerrar agora</button></p></div>`;
    $('#nx').onclick = hostNext;
    $('#fin').onclick = hostEnd;
  } else {
    view.innerHTML = `<div class="wrap wide">${warnBar()}<div class="card hero">
      <div class="big pop">🏆</div><h1>Fim de jogo!</h1><div id="enddyn"></div>
      <button class="btn" id="again">🔁 Nova partida</button><button class="btn alt" id="ex">Sair</button></div></div>`;
    $('#again').onclick = khHostSetup;
    $('#ex').onclick = khExit;
  }
  hostUpdate();
  window.scrollTo({ top: 0 });
}

function hostUpdate() {
  if (!H || KH.role !== 'host') return;
  const cw = $('#connw'); if (cw) cw.hidden = KH.conn;
  const pl = khBoard(H.gid);
  if (H.st === 'lobby') {
    $('#pc').textContent = pl.length;
    $('#plist').innerHTML = pl.map(p => `<span class="chip">${esc(p.nm)}</span>`).join('') || '<span class="mut">Esperando jogadores…</span>';
    $('#st').disabled = pl.length === 0;
  } else if (H.st === 'q') {
    const n = pl.filter(p => p.ai === H.i).length;
    $('#cnt').textContent = `${n}/${pl.length} responderam`;
    if (pl.length && n >= pl.length && !H.revealing) { H.revealing = true; setTimeout(hostReveal, 700); }
  } else if (H.st === 'rv') {
    const d = H.deck[H.i], cnt = [0, 0, 0, 0];
    pl.forEach(p => { if (p.ai === H.i && p.ac >= 0 && p.ac < 4) cnt[p.ac]++; });
    $('#rvdyn').innerHTML = `<div class="tiles">${d.o.map((o, k) =>
      `<div class="tile t${k} ${k === d.c ? 'right' : 'dim'}"><span class="shp">${KSHP[k]}</span><span class="tx">${k === d.c ? '✓ ' : ''}${safeB(o)}</span><b class="cn">${cnt[k]}</b></div>`).join('')}</div>
      <div class="fb ok"><p>💡 ${safeB(d.x)}</p></div>
      <h3>Placar</h3>${boardHTML(pl, 5, true)}`;
  } else {
    $('#enddyn').innerHTML = podiumHTML(pl) + boardHTML(pl, 12, false);
  }
}

/* ======================= aluno ======================= */
function pLoad(gid, nm) {
  const base = { gid, nm, sc: 0, sk: 0, dl: 0, scored: -1, ai: -1, ac: -1, ams: 0, ok: false };
  const o = store.get(KS_PLAYER);
  const p = (o && o.gid === gid && o.nm === nm) ? Object.assign(base, o) : base;
  return Object.assign(p, { curQ: -1, qShown: 0, locked: false, timedOut: false, key: '' });
}
function pSave() { if (P) store.set(KS_PLAYER, { gid: P.gid, nm: P.nm, sc: P.sc, sk: P.sk, dl: P.dl, scored: P.scored, ai: P.ai, ac: P.ac, ams: P.ams, ok: P.ok }); }
function pPub() {
  if (!KH.room || !P) return;
  KH.room.presence({ role: 'p', gid: P.gid, nm: P.nm, sc: P.sc, sk: P.sk, dl: P.dl, ai: P.ai, ac: P.ac, ams: P.ams, si: P.scored, ok: P.ok }).catch(() => {});
}
function findHost() {
  const hs = KH.peers.filter(p => p.presence && p.presence.role === 'h' && p.presence.gid === P.gid);
  return hs.length ? hs.sort((a, b) => b.updatedAt - a.updatedAt)[0].presence : null;
}
function rankText() {
  const l = khBoard(P.gid), k = l.findIndex(p => p.me);
  return k < 0 ? '' : `Você está em <b>${k + 1}º lugar</b> de ${l.length} · ${fmt(P.sc)} pontos`;
}

/* pontos: até 1000 por rapidez (mínimo 500) + bônus de sequência (100 por acerto seguido, até 500) */
function pScore(h) {
  if (P.scored === h.i || !h.rv) return;
  const right = P.ai === h.i && P.ac === h.rv.c;
  if (right) {
    const ratio = Math.min(1, Math.max(0, P.ams / (clampLim(h.lim) * 1000)));
    P.dl = Math.round((1 - ratio / 2) * 1000) + Math.min(P.sk, 5) * 100;
    P.sc += P.dl; P.sk += 1; P.ok = true; sfx('ok');
  } else { P.dl = 0; P.sk = 0; P.ok = false; sfx('bad'); }
  P.scored = h.i; pSave(); pPub();
}

function pSync() {
  if (!P || KH.role !== 'player') return;
  const h = findHost(), hasQ = h && h.q && Array.isArray(h.q.o);
  let key;
  if (!h) { khStop(); key = 'nohost'; }
  else if (h.st === 'lobby') { khStop(); key = 'lobby'; }
  else if (h.st === 'q' && hasQ) {
    if (P.curQ !== h.i) {
      khStop();
      P.curQ = h.i; P.qShown = performance.now(); P.locked = P.ai === h.i; P.timedOut = false;
      const i = h.i;
      KH.tick = setInterval(pTick, 200);
      KH.tm = setTimeout(() => { if (P && P.curQ === i && !P.locked) { P.timedOut = true; pSync(); } }, clampLim(h.lim) * 1000);
    }
    key = 'q' + h.i + (P.locked ? 'L' : '') + (P.timedOut ? 'T' : '');
  } else if (h.st === 'rv' && hasQ && h.rv) { khStop(); pScore(h); key = 'rv' + h.i; }
  else if (h.st === 'end') { khStop(); key = 'end'; }
  else key = 'wait';
  if (key !== P.key) { P.key = key; pRender(h); }
  pUpdate(h);
}

function pTick() {
  const h = P && findHost(), tm = $('#ptm');
  if (!tm || !h || h.st !== 'q') return;
  const lim = clampLim(h.lim), left = Math.max(0, lim - (performance.now() - P.qShown) / 1000);
  tm.textContent = left > 0 ? Math.ceil(left) : '⏰';
  const b = $('#ptbar'); if (b) b.style.width = (left / lim * 100) + '%';
}

function pAnswer(k) {
  const h = findHost();
  if (!h || h.st !== 'q' || P.locked || P.timedOut || P.curQ !== h.i) return;
  const ms = Math.max(0, Math.round(performance.now() - P.qShown));
  if (ms > clampLim(h.lim) * 1000 + 800) return;
  P.locked = true; P.ai = h.i; P.ac = k; P.ams = ms;
  pSave(); pPub(); pSync();
}

function pUpdate(h) {
  const cw = $('#connw'); if (cw) cw.hidden = KH.conn;
  const sc = $('#psc'); if (sc) sc.textContent = '⭐ ' + fmt(P.sc);
  const pr = $('#prank'); if (pr) pr.innerHTML = rankText();
  const pd = $('#pdyn');
  if (pd && h && h.st === 'end') { const l = khBoard(P.gid); pd.innerHTML = podiumHTML(l) + boardHTML(l, 5, false); }
}

function pRender(h) {
  const head = (extra) => `<div class="card hud"><div class="stats"><span class="pill">🎮 ${esc(P.nm)}</span><span class="pill" id="psc">⭐ ${fmt(P.sc)}</span>${extra || ''}</div></div>`;
  const leave = `<button class="btn alt" id="px">Sair da partida</button>`;
  const bindLeave = () => { const b = $('#px'); if (b) b.onclick = () => { store.del(KS_PLAYER); khExit(); }; };
  const k = P.key;
  if (k === 'nohost' || k === 'wait') {
    view.innerHTML = `<div class="wrap">${warnBar()}<div class="card hero"><div class="big">📡</div>
      <h2>${k === 'wait' ? 'Carregando a pergunta…' : 'Aguardando o professor…'}</h2>
      <p class="mut">Sala ${esc(P.gid)}. Se a partida acabou, saia e entre de novo com o novo PIN.</p>${leave}</div></div>`;
  } else if (k === 'lobby') {
    view.innerHTML = `<div class="wrap">${warnBar()}<div class="card hero"><div class="big pop">✅</div>
      <h2>Você entrou, ${esc(P.nm)}!</h2>
      <p>Seu nome já aparece no telão. Quando o professor iniciar, as perguntas surgem aqui.</p>${leave}</div></div>`;
  } else if (k[0] === 'q') {
    const q = h.q, answered = P.ai === h.i, lim = clampLim(h.lim);
    const msg = answered ? '✅ Resposta enviada! Olhe o telão.' : P.timedOut ? '⏰ Tempo esgotado.' : '';
    view.innerHTML = `<div class="wrap">${warnBar()}
      ${head(`<span class="pill">Pergunta ${h.i + 1} de ${+h.n || '?'}</span><span class="pill tmr" id="ptm">${lim}</span>`).replace('</div></div>', '</div><div class="bar"><i id="ptbar" style="width:100%;transition:none"></i></div></div>')}
      <div class="card">${Array.isArray(q.g) ? gridHTML({ rows: q.g }, true) : ''}<p class="qtext">${safeB(q.t)}</p>
      <div class="tiles">${q.o.slice(0, 4).map((o, j) => `<button class="tile t${j}${answered && P.ac === j ? ' pick' : ''}${(P.locked || P.timedOut) && !(answered && P.ac === j) ? ' dim' : ''}" data-k="${j}" ${P.locked || P.timedOut ? 'disabled' : ''}><span class="shp">${KSHP[j]}</span><span class="tx">${safeB(o)}</span></button>`).join('')}</div>
      <p class="mut" style="text-align:center">${msg}</p></div></div>`;
    view.querySelectorAll('.tile').forEach(b => { b.onclick = () => pAnswer(+b.dataset.k); });
    pTick();
  } else if (k.slice(0, 2) === 'rv') {
    const q = h.q, c = h.rv.c;
    const right = P.ok && P.scored === h.i, answered = P.ai === h.i;
    view.innerHTML = `<div class="wrap">${warnBar()}${head()}
      <div class="card hero"><div class="big pop">${right ? '✅' : answered ? '❌' : '⏰'}</div>
      <h2>${right ? 'Correto!' : answered ? 'Não foi dessa vez' : 'Sem resposta'}</h2>
      <p><b>${right ? '+' + fmt(P.dl) : '0'} pontos</b>${P.sk >= 2 ? ` · 🔥 ${P.sk} acertos seguidos` : ''}</p>
      <p id="prank"></p>
      <div class="tiles"><div class="tile t${c} right"><span class="shp">${KSHP[c]}</span><span class="tx">✓ ${safeB(q.o[c])}</span></div></div>
      <div class="fb ok"><p>💡 ${safeB(h.rv.x)}</p></div></div></div>`;
    if (right) confetti();
  } else {
    const top3 = khBoard(P.gid).findIndex(p => p.me) < 3;
    view.innerHTML = `<div class="wrap">${warnBar()}${head()}
      <div class="card hero"><div class="big pop">${top3 ? '🏆' : '🎉'}</div><h1>Fim de jogo!</h1>
      <p id="prank"></p><div id="pdyn"></div>${leave}</div></div>`;
    sfx('win'); if (top3) confetti();
  }
  bindLeave();
  window.scrollTo({ top: 0 });
}

/* atalhos de teclado: A–D ou 1–4 escolhem a alternativa */
document.addEventListener('keydown', e => {
  if (!S || !S.q || S.answered || !view.querySelector('.opt')) return;
  const k = 'abcd1234'.indexOf(e.key.toLowerCase());
  if (k >= 0) answer(k % 4);
});

showStart();
</script>

</body></html>
