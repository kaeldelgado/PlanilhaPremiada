let muted = false;
let audioCtx = null;

function toggleMute() {
  muted = !muted;
  document.getElementById('muteIcon').textContent = muted ? '🔇' : '🔊';
}

function sfx(type) {
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const freqs = {
      ok: [523, 659, 784],
      bad: [220, 165],
      tick: [800],
      win: [523, 659, 784, 1047]
    }[type] || [440];

    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.05, t + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (i + 1) * 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t + i * 0.1);
      osc.stop(t + (i + 1) * 0.1);
    });
  } catch(e) {}
}

function triggerConfetti() {
  const box = document.getElementById('confettiContainer');
  const cols = ['#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6'];
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('span');
    s.className = 'cf';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = cols[i % cols.length];
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = Math.random() * 0.5 + 's';
    box.appendChild(s);
  }
  setTimeout(() => { box.innerHTML = ''; }, 4500);
}

const $ = s => document.querySelector(s);
function setScreen(html) { $('#app').innerHTML = html; }

/* ==========================================================================

  },

    options: ['A fórmula aponta para uma célula/coluna que foi apagada', 'Houve divisão por zero', 'Nome de função inválido', 'Erro de texto no valor'],

function generateMathQuestion() {
  const P = [100, 200, 400, 500][Math.floor(Math.random() * 4)];
  const d = [10, 20, 25, 50][Math.floor(Math.random() * 4)];
  const desc = P * d / 100;
  const F = P - desc;
  
  return {
    q: `Um produto custa R$ ${P},00 e recebeu ${d}% de desconto. Qual o preço final com desconto?`,
    options: [`R$ ${F},00`, `R$ ${desc},00`, `R$ ${P + desc},00`, `R$ ${P - d},00`],
    correctIndex: 0,
    exp: `Desconto de ${d}% de R$ ${P} = R$ ${desc}. Preço final = R$ ${P} - R$ ${desc} = R$ ${F}.`
  };
}

function getAllQuestions() {
  const list = [...STATIC_QUESTIONS];
  list.push(generateMathQuestion());
  list.push(generateMathQuestion());
  // Embaralha alternativas de cada questão
  return list.map(q => {
    const originalCorrect = q.options[q.correctIndex];
    const shuffledOpts = [...q.options].sort(() => Math.random() - 0.5);
    const newCorrectIdx = shuffledOpts.indexOf(originalCorrect);
    return { ...q, options: shuffledOpts, correctIndex: newCorrectIdx };
  });
}

function renderSheetGrid(g) {
  const rows = g.rows;
  const cols = Math.max(...rows.map(r => r.length));
  const L = i => String.fromCharCode(65 + i);
  let h = `<div class="excel-grid my-3 shadow-md rounded-lg overflow-hidden border border-slate-600"><table class="w-full"><tr><th class="w-8"></th>`;
  for (let c = 0; c < cols; c++) h += `<th>${L(c)}</th>`;
  h += '</tr>';
  rows.forEach((r, ri) => {
    h += `<tr><th class="text-slate-400 font-normal">${ri + 1}</th>`;
    for (let c = 0; c < cols; c++) {
      let v = r[c] == null ? '' : String(r[c]);
      let cls = '';
      if (ri === 0) cls = 'font-bold bg-slate-100';
      if (v.startsWith("'")) { v = v.slice(1); }
      else if (v.startsWith('#')) cls += ' err';
      else if (v.startsWith('=')) cls += ' fx';
      else if (ri > 0 && /^(R\$\s?)?-?[\d.,]+%?$/.test(v)) cls += ' num';
      h += `<td class="${cls}">${v}</td>`;
    }
    h += '</tr>';
  });
  return h + '</table></div>';
}

function goHome() {
  if (state.timerId) clearInterval(state.timerId);
  if (state.peer) { try { state.peer.destroy(); } catch(e){} }
  if (state.channel) { try { state.channel.close(); } catch(e){} }
  renderStartScreen();
}

/* ==========================================================================
   4. LÓGICA DO HOST / PROFESSOR (WEBRTC + FALLBACK)
   ========================================================================== */
function setupHostMode() {
  state.mode = 'HOST';
  state.roomCode = Math.floor(1000 + Math.random() * 9000).toString(); // Código de 4 dígitos
  state.playersList = {};
  state.questions = getAllQuestions();
  state.usingFallback = false;

  setScreen(`
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center pop">
      <div class="animate-spin text-4xl mb-4">🔄</div>
      <h3 class="text-xl font-bold text-white mb-2">Iniciando Sala de Aula...</h3>
      <p class="text-slate-400 text-sm">Gerando código ${state.roomCode}</p>
    </div>
  `);

  // Tenta criar conexão via PeerJS
  try {
    const peerId = 'planilha-premiada-room-' + state.roomCode;
    state.peer = new Peer(peerId);

    const peerTimeout = setTimeout(() => {
      console.warn("PeerJS demorou para responder. Ativando fallback de BroadcastChannel.");
      enableHostFallback();
    }, 3000);

    state.peer.on('open', () => {
      clearTimeout(peerTimeout);
      renderHostLobbyScreen();
    });

    state.peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostReceiveData(conn.peer, data, conn));
      conn.on('close', () => {
        delete state.playersList[conn.peer];
        updateHostLobbyUI();
      });
    });

    state.peer.on('error', (err) => {
      clearTimeout(peerTimeout);
      enableHostFallback();
    });
  } catch(e) {
    enableHostFallback();
  }
}

function enableHostFallback() {
  state.usingFallback = true;
  if (state.peer) { try { state.peer.destroy(); } catch(e){} }

  const channelName = 'planilha_premiada_room_' + state.roomCode;
  state.channel = new BroadcastChannel(channelName);

  state.channel.onmessage = (event) => {
    const { senderId, data } = event.data;
    handleHostReceiveData(senderId, data, {
      send: (msg) => {
        state.channel.postMessage({ targetId: senderId, data: msg });
      }
    });
  };

  renderHostLobbyScreen();
}

            📋 Copiar Link
          </button>
        </div>

        <!-- LISTA DE ALUNOS -->
        <div class="md:col-span-2 bg-slate-900/60 rounded-2xl p-4 border border-slate-700 h-64 overflow-y-auto">
          <div class="flex justify-between items-center mb-3">
            <span class="font-bold text-slate-300 text-sm">Jogadores Na Sala:</span>

            <span class="text-slate-500 text-sm italic">Nenhum jogador entrou ainda...</span>
          </div>
        </div>
      </div>

      <!-- AÇÃO DO HOST -->
      <div class="flex justify-between items-center pt-4 border-t border-slate-700">

          Projete esta tela para a turma acompanhar as perguntas e o placar.

          🚀 Iniciar Jogo

      </div>

  `;

function copyJoinLink(url) {
  const t = document.createElement('textarea');
  t.value = url;
  document.body.appendChild(t);
  t.select();
  document.execCommand('copy');
  document.body.removeChild(t);
  alert('Link de entrada copiado!');
}

function handleHostReceiveData(senderId, data, connWrapper) {
  if (data.type === 'JOIN') {
    state.playersList[senderId] = {
      conn: connWrapper,
      name: data.name || 'Aluno Anônimo',
      score: 0,
      answered: false,
      lastChoice: null,
      streak: 0
    };
    sfx('tick');
    if (state.gameState === 'LOBBY') {
      updateHostLobbyUI();
    }
  } else if (data.type === 'ANSWER') {
    const player = state.playersList[senderId];
    if (player && !player.answered && state.gameState === 'QUESTION') {
      player.answered = true;
      player.lastChoice = data.choiceIndex;
      updateHostQuestionAnswersCount();
    }
  }
}

function updateHostLobbyUI() {
  const count = Object.keys(state.playersList).length;
  const countEl = $('#playerCount');
  if (countEl) countEl.textContent = `${count} ${count === 1 ? 'Aluno' : 'Alunos'}`;
  
  const grid = $('#playersGrid');
  if (grid) {
    if (count === 0) {
      grid.innerHTML = `<span class="text-slate-500 text-sm italic">Nenhum jogador entrou ainda...</span>`;
      $('#startHostBtn').disabled = true;
    } else {
      grid.innerHTML = Object.values(state.playersList).map(p => `
        <span class="bg-slate-800 border border-slate-600 text-slate-200 font-bold text-sm px-3 py-1.5 rounded-xl shadow-sm pop flex items-center gap-1.5">
          <span>👤</span> ${p.name}
        </span>
      `).join('');
      $('#startHostBtn').disabled = false;
    }
  }
}

function startHostGame() {
  state.currentQIndex = 0;
  broadcastToPlayers({ type: 'GAME_START' });
  hostNextQuestion();
}

function hostNextQuestion() {
  if (state.currentQIndex >= state.questions.length) {
    hostGameOver();
    return;
  }

  state.gameState = 'QUESTION';
  state.timer = 25;
  const q = state.questions[state.currentQIndex];

  Object.values(state.playersList).forEach(p => {
    p.answered = false;
    p.lastChoice = null;
  });

  broadcastToPlayers({
    type: 'NEW_QUESTION',
    qNum: state.currentQIndex + 1,
    totalQ: state.questions.length
  });

  renderHostQuestionScreen(q);

  if (state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(() => {
    state.timer--;
    const tEl = $('#hostTimer');
    if (tEl) tEl.textContent = state.timer;
    if (state.timer <= 5 && state.timer > 0) sfx('tick');
    
    if (state.timer <= 0) {
      clearInterval(state.timerId);
      evaluateHostAnswers();
    }
  }, 1000);
}

function updateHostQuestionAnswersCount() {
  const players = Object.values(state.playersList);
  const answeredCount = players.filter(p => p.answered).length;
  const countEl = $('#hostAnswerCount');
  if (countEl) {
    countEl.textContent = `${answeredCount} / ${players.length}`;
  }
  if (answeredCount >= players.length && state.timerId) {
    clearInterval(state.timerId);
    evaluateHostAnswers();
  }
}

function renderHostQuestionScreen(q) {
  setScreen(`
    <div class="max-w-5xl w-full bg-slate-800/95 border border-slate-700 rounded-3xl p-6 shadow-2xl pop">
      <!-- HEADER DO HOST -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-700">
        <span class="bg-slate-700 text-slate-200 font-extrabold text-sm px-4 py-1.5 rounded-full">
          Pergunta ${state.currentQIndex + 1} de ${state.questions.length}
        </span>
        <div class="flex items-center gap-4">
          <div class="text-center">
            <span class="text-xs text-slate-400 block font-bold uppercase">Respostas</span>
            <span id="hostAnswerCount" class="text-xl font-black text-emerald-400">0 / ${Object.keys(state.playersList).length}</span>
          </div>
          <div class="w-14 h-14 bg-indigo-600 border-4 border-indigo-400 text-white rounded-full flex items-center justify-center font-black text-2xl shadow-lg" id="hostTimer">
            ${state.timer}
          </div>
        </div>
      </div>

      <!-- TEXTO DA QUESTÃO & TABELA -->
      <div class="my-6 text-center">
        <h3 class="text-2xl md:text-3xl font-black text-white leading-snug">${q.q}</h3>
        ${q.grid ? renderSheetGrid(q.grid) : ''}
      </div>

      <!-- OPÇÕES KAHOOT DE 4 CORES -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        ${q.options.map((opt, i) => {
          const c = KAHOOT_COLORS[i];
          return `
            <div class="${c.bg} border-b-4 ${c.border} rounded-2xl p-4 text-white font-bold text-lg md:text-xl flex items-center gap-4 shadow-lg">
              <span class="bg-black/25 w-10 h-10 rounded-xl flex items-center justify-center text-xl font-black flex-shrink-0">${c.shape}</span>
              <span class="flex-grow">${opt}</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `);
}

function evaluateHostAnswers() {
  state.gameState = 'RESULT';
  const q = state.questions[state.currentQIndex];
  const correctIdx = q.correctIndex;

  Object.values(state.playersList).forEach(p => {
    const isCorrect = p.lastChoice === correctIdx;
    let points = 0;
    if (isCorrect) {
      p.streak = (p.streak || 0) + 1;
      const speedBonus = Math.floor((state.timer / 25) * 300);
      points = 700 + speedBonus + (p.streak * 50);
      p.score += points;
    } else {
      p.streak = 0;
    }

    if (p.conn && p.conn.send) {
      p.conn.send({
        type: 'ROUND_RESULT',
        isCorrect: isCorrect,
        points: points,
        totalScore: p.score,
        correctOptionText: q.options[correctIdx],
        cargo: getCargo(p.score)
      });
    }
  });

  sfx('win');
  renderHostRoundResultScreen(q);
}

function renderHostRoundResultScreen(q) {
  const sortedPlayers = Object.values(state.playersList).sort((a, b) => b.score - a.score);

  setScreen(`
    <div class="max-w-4xl w-full bg-slate-800/95 border border-slate-700 rounded-3xl p-6 md:p-8 shadow-2xl pop">
      <div class="text-center mb-6">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest bg-emerald-950 px-3 py-1 rounded-full border border-emerald-500/30">Gabarito da Rodada</span>
        <h3 class="text-2xl font-black text-white mt-2">Resposta Correta: <span class="text-emerald-400">${q.options[q.correctIndex]}</span></h3>
        <p class="text-slate-300 text-sm mt-1 max-w-xl mx-auto bg-slate-900/60 p-3 rounded-xl border border-slate-700">💡 ${q.exp}</p>
      </div>

      <!-- PLACAR PARCIAL -->
      <div class="bg-slate-900/80 rounded-2xl p-4 border border-slate-700 my-6">
        <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 text-center">🏆 Liderança da Sala</h4>
        <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
          ${sortedPlayers.slice(0, 5).map((p, idx) => {
            const cargo = getCargo(p.score);
            return `
              <div class="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
                <div class="flex items-center gap-3">
                  <span class="font-black text-lg ${idx === 0 ? 'text-amber-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-600' : 'text-slate-500'}">#${idx + 1}</span>
                  <div>
                    <span class="font-bold text-white block leading-none">${p.name}</span>
                    <span class="text-xs text-slate-400">${cargo.icon} ${cargo.name}</span>
                  </div>
                </div>
                <div class="text-right">
                  <span class="font-black text-emerald-400 text-lg">${p.score} pts</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="flex justify-end pt-4 border-t border-slate-700">
        <button onclick="state.currentQIndex++; hostNextQuestion();" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-lg py-3.5 px-8 rounded-2xl shadow-lg transition">
          ${state.currentQIndex + 1 >= state.questions.length ? '🏁 Ver Vencedores Finais' : 'Próxima Pergunta ➔'}
        </button>
      </div>
    </div>
  `);
}

function hostGameOver() {
  state.gameState = 'GAMEOVER';
  const sorted = Object.values(state.playersList).sort((a, b) => b.score - a.score);
  broadcastToPlayers({ type: 'GAME_OVER' });
  triggerConfetti();
  sfx('win');

  setScreen(`
    <div class="max-w-3xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center shadow-2xl pop">
      <div class="text-6xl mb-2">👑</div>
      <h2 class="text-4xl font-black text-white">Fim de Jogo!</h2>
      <p class="text-slate-300 text-base mb-8">Confira os campeões de análise de dados da turma:</p>

      <div class="grid grid-cols-3 gap-3 items-end mb-8 max-w-md mx-auto">
        ${sorted[1] ? `
          <div class="bg-slate-700 p-3 rounded-2xl text-center border border-slate-600">
            <div class="text-2xl">🥈</div>
            <div class="font-bold text-white text-sm truncate">${sorted[1].name}</div>
            <div class="text-emerald-400 font-black text-xs">${sorted[1].score} pts</div>
          </div>
        ` : '<div></div>'}
        ${sorted[0] ? `
          <div class="bg-amber-500/20 border-2 border-amber-400 p-4 rounded-2xl text-center shadow-xl">
            <div class="text-4xl">🏆</div>
            <div class="font-black text-white text-base truncate">${sorted[0].name}</div>
            <div class="text-amber-400 font-black text-sm">${sorted[0].score} pts</div>
          </div>
        ` : '<div></div>'}
        ${sorted[2] ? `
          <div class="bg-slate-700 p-3 rounded-2xl text-center border border-slate-600">
            <div class="text-2xl">🥉</div>
            <div class="font-bold text-white text-sm truncate">${sorted[2].name}</div>
            <div class="text-emerald-400 font-black text-xs">${sorted[2].score} pts</div>
          </div>
        ` : '<div></div>'}
      </div>

      <button onclick="goHome()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg py-4 px-8 rounded-2xl shadow-lg transition">
        🔁 Voltar ao Menu Principal
      </button>
    </div>
  `);
}

function broadcastToPlayers(data) {
  Object.values(state.playersList).forEach(p => {
    if (p.conn && p.conn.send) {
      p.conn.send(data);
    }
  });
}

/* ==========================================================================
   5. LÓGICA DO ALUNO / CELULAR
   ========================================================================== */
function setupPlayerMode() {
  state.mode = 'PLAYER';
  const urlParams = new URLSearchParams(window.location.search);
  const codeParam = urlParams.get('room') || '';

  setScreen(`
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 md:p-8 shadow-2xl pop">
      <div class="text-center mb-6">
        <div class="inline-block text-4xl mb-2">📱</div>
        <h2 class="text-2xl font-black text-white">Entrar na Sala</h2>
        <p class="text-slate-400 text-sm">Digite seu nome e o código de 4 dígitos</p>
      </div>

      <form id="joinForm" onsubmit="connectPlayerToHost(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Seu Nome / Apelido</label>
          <input type="text" id="inputPlayerName" required placeholder="Ex: Ana Silva" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-bold placeholder-slate-500 focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Código da Sala (4 dígitos)</label>
          <input type="number" id="inputRoomCode" required value="${codeParam}" placeholder="Ex: 1234" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white font-black text-2xl tracking-widest text-center placeholder-slate-500 focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-lg py-4 rounded-xl shadow-lg transition">
          🚀 Entrar no Jogo
        </button>
      </form>
    </div>
  `);
}

function connectPlayerToHost(e) {
  e.preventDefault();
  state.playerName = $('#inputPlayerName').value.trim();
  state.roomCode = $('#inputRoomCode').value.trim();

  if (!state.playerName || !state.roomCode) return;

  setScreen(`
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center pop">
      <div class="animate-spin text-4xl mb-4">🔄</div>
      <h3 class="text-xl font-bold text-white mb-2">Conectando à Sala ${state.roomCode}...</h3>
    </div>
  `);

  const playerId = 'player_' + Math.random().toString(36).substring(2, 9);
  let connected = false;

  try {
    state.peer = new Peer();
    const peerTimeout = setTimeout(() => {
      if (!connected) enablePlayerFallback(playerId);
    }, 2500);

    state.peer.on('open', () => {
      const hostPeerId = 'planilha-premiada-room-' + state.roomCode;
      const conn = state.peer.connect(hostPeerId);
      state.hostConn = conn;

      conn.on('open', () => {
        connected = true;
        clearTimeout(peerTimeout);
        conn.send({ type: 'JOIN', name: state.playerName });
        renderPlayerWaitLobby();
      });

      conn.on('data', (data) => handlePlayerReceiveData(data));
      conn.on('error', () => enablePlayerFallback(playerId));
    });

    state.peer.on('error', () => enablePlayerFallback(playerId));
  } catch(err) {
    enablePlayerFallback(playerId);
  }
}

function enablePlayerFallback(playerId) {
  state.usingFallback = true;
  if (state.peer) { try { state.peer.destroy(); } catch(e){} }

  const channelName = 'planilha_premiada_room_' + state.roomCode;
  state.channel = new BroadcastChannel(channelName);

  state.hostConn = {
    send: (payload) => {
      state.channel.postMessage({ senderId: playerId, data: payload });
    }
  };

  state.channel.onmessage = (event) => {
    const { targetId, data } = event.data;
    if (!targetId || targetId === playerId) {
      handlePlayerReceiveData(data);
    }
  };

  state.hostConn.send({ type: 'JOIN', name: state.playerName });
  renderPlayerWaitLobby();
}

function renderPlayerWaitLobby() {
  setScreen(`
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center pop">
      <div class="text-5xl mb-3">✅</div>
      <h2 class="text-2xl font-black text-white">Você está DENTRO!</h2>
      <p class="text-emerald-400 font-bold text-lg mt-1">${state.playerName}</p>
      <p class="text-slate-400 text-sm mt-4">Olhe para a tela do professor para acompanhar o jogo.</p>
    </div>
  `);
}

function handlePlayerReceiveData(data) {
  if (data.type === 'NEW_QUESTION') {
    renderPlayerButtonsScreen(data);
  } else if (data.type === 'ROUND_RESULT') {
    renderPlayerRoundResultState(data);
  } else if (data.type === 'GAME_OVER') {
    renderPlayerGameOverState();
  }
}

function renderPlayerButtonsScreen(data) {
  setScreen(`
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-4 md:p-6 shadow-2xl pop">
      <div class="text-center mb-4">
        <span class="text-xs font-bold text-slate-400 uppercase">Pergunta ${data.qNum} de ${data.totalQ}</span>
        <h3 class="text-white font-black text-lg mt-1">Selecione sua resposta no celular:</h3>
      </div>

      <div class="grid grid-cols-2 gap-4 h-64">
        ${KAHOOT_COLORS.map((c, idx) => `
          <button onclick="sendPlayerAnswer(${idx})" class="${c.bg} ${c.hover} ${c.border} border-b-8 rounded-2xl flex items-center justify-center text-4xl text-white font-black transition active:scale-90">
            ${c.shape}
          </button>
        `).join('')}
      </div>
    </div>
  `);
}

function sendPlayerAnswer(choiceIdx) {
  if (state.hostConn) {
    state.hostConn.send({ type: 'ANSWER', choiceIndex: choiceIdx });
    renderPlayerAnswerSentState();
  }
}

function renderPlayerAnswerSentState() {
  setScreen(`
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center pop">
      <div class="text-6xl mb-4 animate-bounce">👍</div>
      <h3 class="text-2xl font-black text-white">Resposta Enviada!</h3>
      <p class="text-slate-400 text-sm mt-2">Aguarde o encerramento do tempo na tela principal.</p>
    </div>
  `);
}

function renderPlayerRoundResultState(data) {
  if (data.isCorrect) sfx('ok'); else sfx('bad');
  
  setScreen(`
    <div class="max-w-md w-full ${data.isCorrect ? 'bg-emerald-950 border-emerald-500' : 'bg-rose-950 border-rose-500'} border-2 rounded-3xl p-8 text-center shadow-2xl pop">
      <div class="text-6xl mb-2">${data.isCorrect ? '🎉' : '❌'}</div>
      <h2 class="text-3xl font-black text-white">${data.isCorrect ? 'VOCÊ ACERTOU!' : 'INCORRETO'}</h2>
      
      <div class="my-6 bg-slate-900/60 p-4 rounded-2xl border border-white/10">
        <span class="text-xs text-slate-400 font-bold uppercase block">Pontos Ganho</span>
        <span class="text-4xl font-black ${data.isCorrect ? 'text-emerald-400' : 'text-slate-400'}">+${data.points}</span>
        <span class="block text-xs text-slate-300 mt-2">Total: <b>${data.totalScore} pts</b></span>
      </div>

      <div class="flex items-center justify-center gap-2 text-sm bg-black/30 py-2 px-4 rounded-xl">
        <span>${data.cargo.icon}</span>
        <span class="font-bold text-white">${data.cargo.name}</span>
      </div>
    </div>
  `);
}

function renderPlayerGameOverState() {
  triggerConfetti();
  setScreen(`
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center shadow-2xl pop">
      <div class="text-6xl mb-2">🏁</div>
      <h2 class="text-3xl font-black text-white">Fim de Jogo!</h2>
      <p class="text-slate-300 text-sm mt-2">Veja os vencedores na tela do professor!</p>
      <button onclick="goHome()" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition">
        🏠 Menu Principal
      </button>
    </div>
  `);
}

/* ==========================================================================
   6. MODO SOLO / LOCAL
   ========================================================================== */
function setupLocalMode() {
  state.mode = 'LOCAL';
  state.questions = getAllQuestions();
  state.currentQIndex = 0;
  state.playerScore = 0;
  state.streak = 0;
  renderLocalQuestion();
}

function renderLocalQuestion() {
  if (state.currentQIndex >= state.questions.length) {
    renderLocalGameOver();
    return;
  }
  const q = state.questions[state.currentQIndex];
  const cargo = getCargo(state.playerScore);

  setScreen(`
    <div class="max-w-3xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 md:p-8 shadow-2xl pop">
      <div class="flex items-center justify-between pb-4 border-b border-slate-700 mb-4">
        <div class="flex items-center gap-2">
          <span class="text-2xl">${cargo.icon}</span>
          <div>
            <span class="text-xs text-slate-400 block font-bold leading-none">Cargo</span>
            <span class="font-bold text-white text-sm">${cargo.name}</span>
          </div>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-400 block font-bold leading-none">Pontuação</span>
          <span class="text-xl font-black text-emerald-400">${state.playerScore} pts</span>
        </div>
      </div>

      <div class="my-4">
        <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Questão ${state.currentQIndex + 1} de ${state.questions.length}</span>
        <h3 class="text-xl md:text-2xl font-black text-white mt-1">${q.q}</h3>
        ${q.grid ? renderSheetGrid(q.grid) : ''}
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6">
        ${q.options.map((opt, i) => `
          <button onclick="answerLocal(${i})" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-left border border-slate-600 rounded-2xl p-4 text-white font-bold text-base transition flex items-center gap-3">
            <span class="bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 w-8 h-8 rounded-xl flex items-center justify-center font-black flex-shrink-0">${'ABCD'[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `);
}

function answerLocal(idx) {
  const q = state.questions[state.currentQIndex];
  const isCorrect = idx === q.correctIndex;
  
  if (isCorrect) {
    state.streak++;
    state.playerScore += 100 + (state.streak * 20);
    sfx('ok');
  } else {
    state.streak = 0;
    sfx('bad');
  }

  setScreen(`
    <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center shadow-2xl pop">
      <div class="text-6xl mb-2">${isCorrect ? '✅' : '❌'}</div>
      <h3 class="text-2xl font-black text-white">${isCorrect ? 'Resposta Correta!' : 'Incorreta'}</h3>
      <p class="text-slate-300 text-sm mt-2">Resposta certa: <strong class="text-emerald-400">${q.options[q.correctIndex]}</strong></p>
      <p class="text-xs text-slate-400 mt-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700">💡 ${q.exp}</p>
      
      <button onclick="state.currentQIndex++; renderLocalQuestion();" class="mt-6 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg py-3 px-8 rounded-2xl shadow-lg transition">
        Próxima ➔
      </button>
    </div>
  `);
}

function renderLocalGameOver() {
  triggerConfetti();
  sfx('win');
  const cargo = getCargo(state.playerScore);

  setScreen(`
    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center shadow-2xl pop">
      <div class="text-6xl mb-2">${cargo.icon}</div>
      <h2 class="text-3xl font-black text-white">Fim da Carreira!</h2>
      <p class="text-slate-300 text-base mt-1">Sua promoção final:</p>
      <div class="text-2xl font-black text-emerald-400 my-2">${cargo.name}</div>
      <div class="text-xl font-bold text-white mb-6">Pontuação Final: ${state.playerScore} pts</div>

      <button onclick="goHome()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg py-3.5 px-8 rounded-2xl shadow-lg transition">
        🔁 Jogar Novamente
      </button>
    </div>
  `);
}

// Inicializar na Tela Inicial
window.onload = () => {
  renderStartScreen();
};
</script>
